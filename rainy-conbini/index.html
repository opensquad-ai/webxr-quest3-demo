<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>雨夜便利店街角 · Quest 3 走查</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; text-align: center; padding: 24px; z-index: 10;
    background: radial-gradient(circle at 50% 38%, #101a2c 0%, #05070f 72%); color: #e8eefc; }
  #hud.hidden { display: none; }
  h1 { margin: 0; font-size: 28px; letter-spacing: 3px; font-weight: 500; }
  h1 small { display: block; font-size: 12px; font-weight: 400; opacity: .55; letter-spacing: 5px; margin-top: 10px; }
  #desc { max-width: 540px; line-height: 1.8; font-size: 14px; opacity: .8; }
  #desc b { color: #7fd8c0; }
  button { font: inherit; font-size: 17px; padding: 13px 32px; border-radius: 999px; border: 0;
    background: linear-gradient(135deg, #7fd8c0, #4a86c8); color: #04121f; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #status { font-size: 13px; opacity: .6; min-height: 18px; }
  #log { font-size: 11px; opacity: .35; max-width: 640px; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #05070f; color: #6f88ad; z-index: 20; font-size: 14px; letter-spacing: 3px; }
  #overlay.hidden { display: none; }
  #tags { position: fixed; top: 14px; left: 16px; z-index: 6; font-size: 13px; color: #7f97b8;
    display: flex; gap: 12px; }
  #tags span { background: rgba(6,10,20,.62); border: 1px solid rgba(120,180,255,.18);
    padding: 4px 12px; border-radius: 999px; }
  #vrFab { position: fixed; right: 18px; bottom: 18px; z-index: 6; font-size: 14px; padding: 10px 20px;
    border-radius: 999px; border: 1px solid rgba(127,216,192,.5); background: rgba(6,10,20,.72);
    color: #7fd8c0; cursor: pointer; }
  #vrFab.hidden { display: none; }
</style>
</head>
<body>
<div id="overlay">正在进入雨夜…</div>
<div id="tags">
  <span>所在：<b id="roomTag">-</b></span>
  <span>移动：<b id="modeTag">-</b></span>
  <span>提示：<b id="hintTag">—</b></span>
</div>
<button id="vrFab" class="hidden">进入 VR</button>
<div id="hud">
  <h1>雨夜便利店街角<small>RAINY NIGHT · KONBINI CORNER</small></h1>
  <p id="desc">
    深夜十一点四十七分，住宅区街角还亮着一家便利店。<br>
    <b>右摇杆</b>走动，<b>左摇杆</b>转身，<b>扳机</b>开门、拉冰柜、按贩卖机。<br>
    没有头显也可以用键盘鼠标先逛一圈。
  </p>
  <button id="enter">进入 VR</button>
  <div id="status">正在检查 WebXR 支持…</div>
  <div id="log"></div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
  }
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
<script type="module" src="./conbini.js"></script>
</body>
</html>
